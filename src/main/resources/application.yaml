spring:
  application:
    name: cdg
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:controle_de_gastos}?useTimezone=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false
api:
  web:
    base-url: ${CDG_WEB_URL:http://localhost:5173}
  security:
    token:
      secret: ${JWT_SECRET}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
